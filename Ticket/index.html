<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PMPML Ticket Replica</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
}


body{
    margin:0;
    padding:0px;
    height:100dvh;
    display:flex;
    justify-content:center;

    font-family:'Noto Sans Devanagari',sans-serif;

    background:#de9aac;
}

/* ---------------- Ticket ---------------- */

.ticket-container{

    width:min(400px, calc(100vw - 32px));

    height:100%;

    margin:0 auto;

    padding:16px 0;

    box-sizing:border-box;

    display:flex;
    flex-direction:column;

    justify-content:space-between;
}

.ticket{
    width:100%;

    background:#fff;

    border-radius:18px;
    overflow:hidden;

    padding:12px 14px 14px;
}

/* ---------------- Top Bar ---------------- */

.topbar{
    display:flex;
    justify-content:space-between;

    margin-bottom:22px;

    font-size:14px;
}

/* ---------------- Header ---------------- */

.header{

    background:#c62828;
    color:#fff;

    text-align:center;
    font-size:20px;
    font-weight:20;

    margin:-12px -20px 0;
    padding:10px 10px;

    border-radius:20px 20px 0 0;

    
}

/* ---------------- Pass Info ---------------- */

.row{
    display:flex;
    justify-content:space-between;

    padding:16px 0;
}

.label{
    font-size:13px;
    color:#777;
}

.value{
    font-size:18px;
    font-weight:700;
}

.id{
    font-size:22px;
    line-height:1;
    font-weight:700;
}

.fare{
    font-size:22px;
    font-weight:700;
}

/* ---------------- Separator ---------------- */

.separator1{
    position:relative;

    margin:8px -18px 18px;

    border-top:1.5px dashed #d8d8d8;
}

.separator1::before,
.separator1::after{

    content:"";

    position:absolute;

    width:28px;
    height:28px;

    top:-15px;

    border-radius:50%;

    background:#de9aac;

     
}

.separator1::before{
    left:-14px;
}

.separator1::after{
    right:-14px;
}

.separator2{
    position:relative;

    margin:8px -18px 18px;

    border-top:1.5px dashed #d8d8d8;
}

/* ---------------- Time ---------------- */

.times{
    display:flex;
    justify-content:space-between;

    font-size:14px;
}

/* ---------------- Pass Code ---------------- */

.code{
    margin:18px 0;

    text-align:center;

    color:#555;
}

/* ---------------- Logo Area ---------------- */

.placeholder-area{
    position:relative;

    height:240px;
}

.pass-strip{

    position:absolute;

    top:-10px;
    left:-30px;
    right:-30px;

    height:30px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#c62828;
    color:#fff;

    font-size:16px;
    font-weight:500;

    z-index:2;
}

.logo-placeholder{
    position:absolute;

    left:50%;
    top:75px;

    transform:translateX(-50%);

    width:180px;
    height:180px;

    display:flex;
    justify-content:center;
    align-items:center;
}

.logo-placeholder img{
    width:100%;
    height:100%;
    object-fit:cover;
    animation:pulse 2s ease-in-out infinite;
}

@keyframes pulse{
    0%{
        transform:scale(0.7);
    }

    50%{
        transform:scale(1.3);
    }

    100%{
        transform:scale(0.7);
    }
}
/* ---------------- Expired ---------------- */

.expired{

    margin:8px 0 14px;

    text-align:center;

    color: transparent;

    font-size:18px;
}

/* ---------------- Button ---------------- */

.button{

    height:54px;

    display:flex;
    justify-content:center;
    align-items:center;

    border:2px solid #2fa84f;
    border-radius:10px;

    color:#2fa84f;

    font-size:18px;


}

</style>

</head>

<body>
    <div class="ticket-container">

        <div class="topbar">
        <div>✕</div>
        <div>
            <u>Need Help?</u>&nbsp;&nbsp;
            <u>All passes</u>
        </div>
        </div>

        <div class="ticket">
        <div class="header">
            पुणे महानगर परिवहन महामंडळ लि.
        </div>

        <div class="row">

            <div>
                <div class="label">Pass Type</div>
                <div class="value">PMC &amp; PCMC</div>
            </div>

            <div>
                <div class="label">ID</div>
                <div class="id">4746</div>
            </div>

            <div>
                <div class="label">Fare</div>
                <div class="fare">₹70.83</div>
            </div>

        </div>

        <div class="separator1"></div>

        <div class="times">

            <div>
                <div class="label">Booking Time</div>
                <b id="booking-time"></b>
            </div>

            <div>
                <div class="label">Validity Time</div>
                <b id="validity-time"></b>
            </div>

        </div>

        <div class="code">
            26071608238TWV6W
        </div>
        <div class="separator2"></div>
        <div class="placeholder-area">

            <div class="pass-strip">
                One Day Pass
            </div>

            <div class="logo-placeholder">
                <img src="pmpml-logo.png" alt="PMPML Logo">
            </div>

        </div>

        <div class="expired">
            Expired
        </div>
        </div>

        <div class="button">
            ⌗&nbsp;&nbsp;Show QR code
        </div>
    </div>

    <script>
        const container = document.querySelector(".ticket-container");

        let lastTap = 0;

        container.addEventListener("touchend", function(e){

            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;

            if(tapLength < 300 && tapLength > 0){
                toggleFullscreen();
                e.preventDefault();
            }

            lastTap = currentTime;

        });

        container.addEventListener("dblclick", toggleFullscreen);

        function toggleFullscreen(){

            if(!document.fullscreenElement){

                document.documentElement.requestFullscreen();

            }else{

                document.exitFullscreen();

            }

        }

        function updateDates() {
            const today = new Date();

            const months = [
                "Jan","Feb","Mar","Apr","May","Jun",
                "Jul","Aug","Sep","Oct","Nov","Dec"
            ];

            const day = String(today.getDate()).padStart(2, "0");
            const month = months[today.getMonth()];
            const year = String(today.getFullYear()).slice(-2);

            document.getElementById("booking-time").textContent =
                `${day} ${month}, ${year} | 08:03 AM`;

            document.getElementById("validity-time").textContent =
                `${day} ${month}, ${year} | 11:59 PM`;
        }

        updateDates();        
    </script>

</body>

</html>
